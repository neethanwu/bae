# Publish workflow for npm projects.
# Triggered when a version tag (v*) is pushed.
# Generated by the /release skill. Adapt as needed.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - run: bun run test

      - run: bun run build

      - name: Determine publish tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-rc"* ]]; then
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: |
          if [ "${{ steps.tag.outputs.dist_tag }}" = "latest" ]; then
            npm publish --provenance
          else
            npm publish --provenance --tag ${{ steps.tag.outputs.dist_tag }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/p;/^## \[/!p;}" CHANGELOG.md 2>/dev/null || echo "Release $GITHUB_REF_NAME")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            gh release create "${{ github.ref_name }}" --prerelease --notes "${{ steps.changelog.outputs.body }}"
          else
            gh release create "${{ github.ref_name }}" --notes "${{ steps.changelog.outputs.body }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
